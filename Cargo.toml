[package]
name = "qwartz"
version = "0.1.0"
edition = "2021"
description = "R-Labs Next-Generation Cryptographic System"
authors = ["R-Labs <lvs0@proton.me>"]
license = "MIT"
repository = "https://github.com/lvs0/Qwartz"
keywords = ["cryptography", "post-quantum", "security", "zero-knowledge"]
categories = ["cryptography", "security"]

[dependencies]
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
getrandom = "0.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "qwartz"
path = "src/main.rs"

[lib]
name = "qwartz"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
